[package]
name = "resolvestudio-patcher"
version = "0.1.0"
edition = "2024"
description = "a patcher for davinci resolve studio"
publish = false

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dependencies]
plist = { version = "1.10.1", default-features = false }
sha1 = "0.11.0"
sha2 = "0.11.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_Diagnostics_ToolHelp"] }
